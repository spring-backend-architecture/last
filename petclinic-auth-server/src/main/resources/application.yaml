spring:
  application:
    name: petclinic-auth-server

  datasource:
    url: jdbc:postgresql://postgres:5432/auth
    username: jack
    password: 123

  security:
    oauth2:
      authorizationserver:
        issuer: http://localhost:9000

server:
  port: 9000

  servlet:
    session:
      cookie:
        name: AUTHSERVER-SESSION

logging:
  level:
    org.flywaydb: debug
    org.springframework.security: trace
    org.springframework.jdbc.core: trace
    org.springframework.jdbc.support: debug