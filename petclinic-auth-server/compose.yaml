services:

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: auth
      POSTGRES_PASSWORD: 123
      POSTGRES_USER: jack
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U jack -d auth" ]
      interval: 5s
      timeout: 5s
      retries: 10

  authorization-server:
    build: .
    ports:
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
