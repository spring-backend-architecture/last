services:

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: resource
      POSTGRES_PASSWORD: 123
      POSTGRES_USER: jack
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jack -d resource"]
      interval: 5s
      timeout: 5s
      retries: 10

  resource-server:
    build: .
    ports:
      - "8090:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy